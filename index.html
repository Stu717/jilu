<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeLog</title>
<style>
  body{font-family:sans-serif;background:#f8f9fa;margin:0;padding:16px;color:#333}
  .container{max-width:600px;margin:0 auto}
  .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:16px}
  .btn{border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;transition:.15s}
  .btn-primary{background:#0f172a;color:#fff}.btn-primary:hover{background:#1e293b}
  .btn-secondary{background:#e2e8f0;color:#333}.btn-secondary:hover{background:#cbd5e1}
  .btn-danger{background:#fee2e2;color:#b91c1c}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tpl{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
  .tpl:hover{border-color:#999;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
  .tpl-icon{width:40px;height:40px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;border-radius:8px}
  .tpl-icon img{width:100%;height:100%;object-fit:cover}
  .inp{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px;margin-bottom:12px;font-size:14px;box-sizing:border-box;outline:none;background:#fff}
  .inp:focus{border-color:#666}
  .record-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0;align-items:flex-start}
  .record-item:last-child{border-bottom:none}
  .rec-icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;border-radius:6px}
  .rec-icon img{width:100%;height:100%;object-fit:cover}
  .mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999}
  .modal{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:400px;max-height:90vh;overflow-y:auto}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .empty{text-align:center;color:#999;padding:20px 0;font-size:14px}
  .tag{font-size:11px;color:#999}
  .tag-badge{display:inline-block;font-size:11px;background:#0f172a;color:#fff;padding:1px 8px;border-radius:10px;margin-left:6px}
  .icon-preview{width:56px;height:56px;border-radius:10px;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;flex-shrink:0}
  .icon-preview img{width:100%;height:100%;object-fit:cover}
  .range-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .range-btn{padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;border:none;background:#e2e8f0;color:#333}
  .range-btn.active{background:#0f172a;color:#fff}
  .custom-range{display:none;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:#666;flex-wrap:wrap}
  .custom-range.show{display:flex}
  .custom-range input{width:auto;padding:6px 8px;margin:0;font-size:13px}
  .stat-row{margin-bottom:10px}
  .stat-row:last-child{margin-bottom:0}
  .stat-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .stat-bar{height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden}
  .stat-bar-fill{height:100%;background:#0f172a;border-radius:3px}
  .pin-wrap{text-align:center;margin-top:80px}
  .pin-wrap h1{font-size:24px;margin-bottom:8px}
  .pin-wrap p{color:#888;font-size:14px;margin-bottom:20px}
  .pin-card{text-align:left;max-width:320px;margin:0 auto}
  .err{color:#e11d48;font-size:12px;margin-bottom:8px}
  .time-hint{font-size:12px;color:#888;padding:8px;background:#f8f9fa;border-radius:8px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app" class="container"></div>
<div id="modalRoot"></div>

<script>
/* ============ 工具 ============ */
var PIN_KEY='lifelog_pin', ACC_KEY='lifelog_accounts', LAST_KEY='lifelog_last_account';
function $(s){ return document.querySelector(s); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hash(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return 'h'+(h>>>0).toString(36); }
function pad(n){ return n<10?'0'+n:''+n; }
function fmtTime(iso){ var d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function dayKey(iso){ var d=new Date(iso); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDay(k){ var t=dayKey(new Date().toISOString()),y=dayKey(new Date(Date.now()-86400000).toISOString()); if(k===t)return'今天'; if(k===y)return'昨天'; var p=k.split('-'); return parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日'; }
function fmtNum(n){ var x=Number(n); if(!isFinite(x)) return '0'; return String(Math.round(x*100)/100); }
function LSread(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function LSwrite(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ alert('保存失败，可能浏览器空间不足'); } }
function dataKey(id){ return 'lifelog_data_'+id; }

/* 精度标签 */
var PREC_LABEL = { minute:'分钟', hour:'小时', day:'日', month:'月', year:'年', none:'无时间' };

/* ============ 状态 ============ */
var state = {
  view:'lock', accounts:[], currentAccountId:null, data:null,
  modal:null, range:'today', customFrom:'', customTo:'', pinError:''
};

/* ============ PIN ============ */
function hasPin(){ return !!localStorage.getItem(PIN_KEY); }
function setPin(p){ localStorage.setItem(PIN_KEY, hash(p)); }
function checkPin(p){ return localStorage.getItem(PIN_KEY)===hash(p); }

/* ============ 账号 ============ */
function loadAccounts(){ state.accounts = LSread(ACC_KEY, []); }
function saveAccounts(){ LSwrite(ACC_KEY, state.accounts); }
function getAccount(id){ return state.accounts.filter(function(a){return a.id===id;})[0]||null; }
function createAccount(name){
  var acc = { id:uid(), name:name, createdAt:new Date().toISOString() };
  state.accounts.push(acc); saveAccounts();
  LSwrite(dataKey(acc.id), { templates:defaultTemplates(), records:[] });
  return acc;
}
function deleteAccount(id){
  state.accounts = state.accounts.filter(function(a){return a.id!==id;});
  saveAccounts(); localStorage.removeItem(dataKey(id));
  if(state.currentAccountId===id){ state.currentAccountId=null; state.data=null; LSwrite(LAST_KEY,null); }
}
function renameAccount(id,name){ var a=getAccount(id); if(a){ a.name=name; saveAccounts(); } }

/* ============ 数据 ============ */
function loadData(accId){
  var raw = LSread(dataKey(accId), null) || {};
  state.data = {
    templates: (raw.templates && raw.templates.length) ? raw.templates : defaultTemplates(),
    records: raw.records || []
  };
  state.data.templates.forEach(function(t){ if(!t.precision) t.precision='minute'; });
  state.currentAccountId = accId;
  LSwrite(LAST_KEY, accId);
}
function saveData(){ if(state.currentAccountId) LSwrite(dataKey(state.currentAccountId), state.data); }
function switchAccount(id){ if(state.currentAccountId) saveData(); loadData(id); state.view='home'; render(); }

/* ============ 默认模板 ============ */
function defaultTemplates(){
  return [
    {id:uid(),name:'早饭',icon:'🍳',image:null,unit:'元',amountEnabled:true,contentEnabled:true,contentHint:'吃了什么',precision:'day'},
    {id:uid(),name:'午饭',icon:'🍚',image:null,unit:'元',amountEnabled:true,contentEnabled:true,contentHint:'吃了什么',precision:'day'},
    {id:uid(),name:'晚饭',icon:'🍜',image:null,unit:'元',amountEnabled:true,contentEnabled:true,contentHint:'吃了什么',precision:'day'},
    {id:uid(),name:'运动',icon:'🏃',image:null,unit:'公里',amountEnabled:true,contentEnabled:true,contentHint:'做了什么',precision:'minute'},
    {id:uid(),name:'睡眠',icon:'😴',image:null,unit:'小时',amountEnabled:true,contentEnabled:true,contentHint:'睡眠质量',precision:'minute'},
    {id:uid(),name:'阅读',icon:'📖',image:null,unit:'小时',amountEnabled:true,contentEnabled:true,contentHint:'书名',precision:'minute'},
    {id:uid(),name:'随手记',icon:'📝',image:null,unit:'',amountEnabled:false,contentEnabled:true,contentHint:'记点什么',precision:'minute'}
  ];
}

/* ============ 时间精度解析 ============ */
function renderTimeInput(precision, currentAt){
  var d = currentAt ? new Date(currentAt) : new Date();
  if (precision === 'minute') {
    var v = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
    return '<input id="recAt" class="inp" type="datetime-local" value="'+v+'">';
  }
  if (precision === 'hour') {
    var dv = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var opts = '';
    for (var i=0;i<24;i++) opts += '<option value="'+i+'"'+(i===d.getHours()?' selected':'')+'>'+pad(i)+' 时</option>';
    return '<div style="display:flex;gap:8px"><input id="recAt" class="inp" type="date" value="'+dv+'" style="flex:2">'+
      '<select id="recHour" class="inp" style="flex:1">'+opts+'</select></div>';
  }
  if (precision === 'day') {
    var dv2 = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    return '<input id="recAt" class="inp" type="date" value="'+dv2+'">';
  }
  if (precision === 'month') {
    var mv = d.getFullYear()+'-'+pad(d.getMonth()+1);
    return '<input id="recAt" class="inp" type="month" value="'+mv+'">';
  }
  if (precision === 'year') {
    return '<input id="recAt" class="inp" type="number" min="1900" max="2100" value="'+d.getFullYear()+'" placeholder="年份（如 2026）">';
  }
  return '<div class="time-hint">这条记录不关联时间</div>';
}
function parseTimeInput(precision){
  if (precision === 'none') return null;
  var el = document.getElementById('recAt');
  if (!el || !el.value) return null;
  var v = el.value;
  try {
    if (precision === 'minute') return new Date(v).toISOString();
    if (precision === 'hour') {
      var h = document.getElementById('recHour').value;
      return new Date(v + 'T' + pad(parseInt(h,10)) + ':00:00').toISOString();
    }
    if (precision === 'day') return new Date(v + 'T12:00:00').toISOString();
    if (precision === 'month') return new Date(v + '-01T12:00:00').toISOString();
    if (precision === 'year') {
      var y = parseInt(v, 10);
      if (!isFinite(y) || y<1900 || y>2100) return null;
      return new Date(y + '-01-01T12:00:00').toISOString();
    }
  } catch(e) { return null; }
  return null;
}

/* ============ 动作 ============ */
function doSetup(){
  var p1=document.getElementById('pin1').value;
  var p2=document.getElementById('pin2').value;
  if(p1.length<4) return alert('PIN 至少 4 位');
  if(p1!==p2) return alert('两次输入不一致');
  setPin(p1);
  loadAccounts();
  var acc = createAccount('我的记录');
  loadData(acc.id);
  state.view='home'; render();
}
function doUnlock(){
  var p=document.getElementById('pin').value;
  if(!checkPin(p)){ state.pinError='PIN 不正确'; render(); var el=document.getElementById('pin'); if(el) el.focus(); return; }
  state.pinError='';
  loadAccounts();
  var last = LSread(LAST_KEY, null);
  var acc = last ? getAccount(last) : null;
  if(!acc && state.accounts.length) acc = state.accounts[0];
  if(acc){ loadData(acc.id); state.view='home'; }
  else { state.view='accounts'; }
  render();
}
function doLock(){
  if(state.currentAccountId) saveData();
  state.currentAccountId=null; state.data=null; state.pinError='';
  loadAccounts(); state.view='lock'; render();
  setTimeout(function(){ var el=document.getElementById('pin'); if(el) el.focus(); }, 50);
}
function openNewAccount(){ state.modal={type:'newAccount'}; renderModal(); }
function openRenameAccount(id){ var a=getAccount(id); if(!a) return; state.modal={type:'renameAccount', id:id, name:a.name}; renderModal(); }
function openChangePin(){ state.modal={type:'changePin'}; renderModal(); }
function doDeleteAccount(id){
  if(state.accounts.length<=1) return alert('至少要保留一个账号');
  var a=getAccount(id); if(!a) return;
  if(!confirm('确定删除账号「'+a.name+'」？该账号的所有记录也会被删除。')) return;
  var wasCurrent = state.currentAccountId===id;
  deleteAccount(id);
  if(wasCurrent){
    var rest = state.accounts[0];
    if(rest){ loadData(rest.id); state.view='home'; }
    else { state.view='lock'; }
  }
  render();
}

/* ============ 模板/记录 ============ */
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; state.modal=null; }
function openRecord(tid){
  var t=state.data.templates.filter(function(x){return x.id===tid;})[0]; if(!t) return;
  state.modal={type:'record',template:t}; renderModal();
}
function saveRecord(){
  var m=state.modal; if(!m) return;
  var t=m.template;
  var prec = t.precision || 'minute';
  var aEl=document.getElementById('recAmt'), cEl=document.getElementById('recCon');
  var amount = aEl?aEl.value.trim():'';
  var content = cEl?cEl.value.trim():'';
  if(amount==='' && content===''){ alert('请至少填写数值或内容'); return; }
  var at = parseTimeInput(prec);
  state.data.records.push({
    id:uid(), templateId:t.id, at: at,
    amount: amount===''?null:Number(amount), content: content,
    createdAt:new Date().toISOString()
  });
  saveData(); closeModal(); render();
}
function openTemplate(tid){
  var t;
  if(tid){ t=state.data.templates.filter(function(x){return x.id===tid;})[0]; if(!t) return; state.modal={type:'template',template:JSON.parse(JSON.stringify(t))}; }
  else { state.modal={type:'template',template:{id:null,name:'',icon:'📌',image:null,unit:'',amountEnabled:true,contentEnabled:true,precision:'minute'}}; }
  renderModal();
}
function handleIconUpload(file){
  if(!file) return;
  if(file.size>10*1024*1024){ alert('图片太大了，请选择 10MB 以内的图片'); return; }
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'); c.width=96; c.height=96;
      var ctx=c.getContext('2d');
      var min=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,96,96);
      state.modal.template.image=c.toDataURL('image/png');
      renderModal();
    };
    img.onerror=function(){ alert('图片加载失败'); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function clearIcon(){ state.modal.template.image=null; renderModal(); }
function saveTemplate(){
  var m=state.modal; if(!m) return;
  var t=m.template;
  var name=document.getElementById('tplName').value.trim();
  if(!name) return alert('请输入模板名称');
  var icon=document.getElementById('tplIcon').value||'📌';
  var unit=document.getElementById('tplUnit').value.trim();
  var amt=document.getElementById('tplAmt').checked;
  var con=document.getElementById('tplCon').checked;
  var prec=document.getElementById('tplPrec').value;
  if(t.id){
    var e=state.data.templates.filter(function(x){return x.id===t.id;})[0];
    if(e){ e.name=name; e.icon=icon; e.image=t.image; e.unit=unit; e.amountEnabled=amt; e.contentEnabled=con; e.precision=prec; }
  } else {
    state.data.templates.push({ id:uid(),name:name,icon:icon,image:t.image,unit:unit,amountEnabled:amt,contentEnabled:con,precision:prec,defaultAmount:'',contentHint:'' });
  }
  saveData(); closeModal(); render();
}
function delTemplate(id){
  if(!confirm('确定删除此模板？其下所有记录也会被删除')) return;
  state.data.records=state.data.records.filter(function(r){return r.templateId!==id;});
  state.data.templates=state.data.templates.filter(function(t){return t.id!==id;});
  saveData(); closeModal(); render();
}

/* ============ 统计 ============ */
function getRangeBounds(){
  var r = state.range;
  var endOfToday = new Date(); endOfToday.setHours(23,59,59,999);
  if (r === 'all') return [0, endOfToday.getTime()];
  if (r === 'custom') {
    var f = state.customFrom ? new Date(state.customFrom + 'T00:00:00').getTime() : 0;
    var t = state.customTo ? new Date(state.customTo + 'T23:59:59').getTime() : endOfToday.getTime();
    return [f, t];
  }
  var d = new Date(); d.setHours(0,0,0,0);
  if (r === 'today')   return [d.getTime(), endOfToday.getTime()];
  if (r === 'week')    { var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return [d.getTime(), endOfToday.getTime()]; }
  if (r === 'month')   { d.setDate(1); return [d.getTime(), endOfToday.getTime()]; }
  if (r === '7days')   { d.setDate(d.getDate()-6); return [d.getTime(), endOfToday.getTime()]; }
  if (r === '30days')  { d.setDate(d.getDate()-29); return [d.getTime(), endOfToday.getTime()]; }
  return [d.getTime(), endOfToday.getTime()];
}
function buildStats(){
  var bounds = getRangeBounds();
  var from = bounds[0], to = bounds[1];
  var isAll = state.range === 'all';
  var rs = state.data.records.filter(function(r){
    if (r.at === null || r.at === undefined || r.at === '') return isAll; // 无时间的只在"全部"里算
    var t = new Date(r.at).getTime();
    return t >= from && t <= to;
  });
  var byUnit={};
  rs.forEach(function(r){
    var t=state.data.templates.filter(function(x){return x.id===r.templateId;})[0];
    if(!t || r.amount===null || r.amount===undefined || r.amount==='') return;
    var u=t.unit && t.unit.trim() ? t.unit.trim() : '（无单位）';
    if(!byUnit[u]) byUnit[u]={ total:0, items:{} };
    if(!byUnit[u].items[t.id]) byUnit[u].items[t.id]={ name:t.name, icon:t.icon, image:t.image, sum:0, count:0 };
    var v=Number(r.amount)||0;
    byUnit[u].total+=v; byUnit[u].items[t.id].sum+=v; byUnit[u].items[t.id].count+=1;
  });
  var result=[];
  Object.keys(byUnit).forEach(function(u){
    var arr=Object.keys(byUnit[u].items).map(function(k){ return byUnit[u].items[k]; });
    arr.sort(function(a,b){ return b.sum-a.sum; });
    result.push({ unit:u, total:byUnit[u].total, items:arr });
  });
  result.sort(function(a,b){ return b.total-a.total; });
  return result;
}
function setRange(r){
  state.range = r;
  if (r === 'custom') {
    if (!state.customFrom) { var d = new Date(); d.setDate(1); state.customFrom = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    if (!state.customTo) { var t = new Date(); state.customTo = t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
  }
  render();
}
function setCustomFrom(v){ state.customFrom = v; render(); }
function setCustomTo(v){ state.customTo = v; render(); }

/* ============ 渲染 ============ */
function render(){
  var app=document.getElementById('app');
  var v=state.view;
  if(v==='setup') app.innerHTML=renderSetup();
  else if(v==='lock') app.innerHTML=renderLock();
  else if(v==='accounts') app.innerHTML=renderAccounts();
  else if(v==='home') app.innerHTML=renderHome();
  else if(v==='stats') app.innerHTML=renderStats();
  else if(v==='settings') app.innerHTML=renderSettings();
  renderModal();
  setTimeout(function(){
    var el=document.getElementById('pin')||document.getElementById('pin1');
    if(el && state.view!=='home') el.focus();
  },30);
}
function renderSetup(){
  return '<div class="pin-wrap"><h1>LifeLog</h1><p>第一次使用，请设置一个 PIN 码</p>'+
    '<div class="card pin-card">'+
    '<input id="pin1" class="inp" type="password" inputmode="numeric" placeholder="设置 PIN（至少 4 位）" onkeydown="if(event.key===\'Enter\')document.getElementById(\'pin2\').focus()">'+
    '<input id="pin2" class="inp" type="password" inputmode="numeric" placeholder="再次输入确认" onkeydown="if(event.key===\'Enter\')doSetup()">'+
    '<button class="btn btn-primary" style="width:100%" onclick="doSetup()">确定</button>'+
    '<p style="font-size:11px;color:#aaa;margin-top:12px;line-height:1.6">PIN 用于锁定这个网页，防止别人拿你的设备时看到记录。数据只存在浏览器本地，不会上传。</p>'+
    '</div></div>';
}
function renderLock(){
  return '<div class="pin-wrap"><h1>LifeLog</h1><p>请输入 PIN 解锁</p>'+
    '<div class="card pin-card">'+
    '<input id="pin" class="inp" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key===\'Enter\')doUnlock()">'+
    (state.pinError?'<div class="err">'+esc(state.pinError)+'</div>':'')+
    '<button class="btn btn-primary" style="width:100%" onclick="doUnlock()">解锁</button>'+
    '</div></div>';
}
function renderAccounts(){
  var html='<div class="header"><b>账号管理</b>';
  if(state.currentAccountId) html+='<button class="btn btn-secondary" style="padding:4px 8px;font-size:12px" onclick="state.view=\'home\';render()">返回</button>';
  html+='</div>';
  html+='<div class="card">';
  if(!state.accounts.length) html+='<p class="empty">还没有账号</p>';
  state.accounts.forEach(function(a){
    var cur=a.id===state.currentAccountId;
    var cnt=(LSread(dataKey(a.id),{}).records||[]).length;
    html+='<div style="display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #f0f0f0">'+
      '<div style="flex:1;min-width:0"><div style="font-size:15px">'+esc(a.name)+(cur?'<span class="tag-badge">当前</span>':'')+'</div>'+
      '<div style="font-size:12px;color:#888">'+cnt+' 条记录</div></div>'+
      (cur?'':'<button class="btn btn-secondary" style="padding:4px 10px;font-size:12px" onclick="switchAccount(\''+a.id+'\')">切换</button>')+
      '<button class="btn btn-secondary" style="padding:4px 10px;font-size:12px" onclick="openRenameAccount(\''+a.id+'\')">改名</button>'+
      '<button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="doDeleteAccount(\''+a.id+'\')">删除</button>'+
      '</div>';
  });
  html+='<button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="openNewAccount()">+ 新建账号</button></div>';
  html+='<div class="card"><b style="font-size:14px">安全</b>'+
    '<button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="openChangePin()">修改 PIN</button></div>';
  return html;
}
function renderHome(){
  var ts=state.data.templates;
  var rs=state.data.records.slice().sort(function(a,b){
    var ta = a.at ? new Date(a.at).getTime() : -1;
    var tb = b.at ? new Date(b.at).getTime() : -1;
    return tb - ta;
  });
  var timed = rs.filter(function(r){ return r.at; });
  var untimed = rs.filter(function(r){ return !r.at; });
  var groups={}, order=[];
  timed.forEach(function(r){ var k=dayKey(r.at); if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(r); });
  var acc=getAccount(state.currentAccountId);
  var html='<div class="header"><b>LifeLog</b><div>'+
    '<button class="btn btn-secondary" style="padding:4px 8px;font-size:12px" onclick="state.view=\'accounts\';render()">'+esc(acc?acc.name:'账号')+'</button>'+
    '<button class="btn btn-secondary" style="padding:4px 8px;font-size:12px;margin-left:4px" onclick="state.view=\'stats\';render()">统计</button>'+
    '<button class="btn btn-secondary" style="padding:4px 8px;font-size:12px;margin-left:4px" onclick="state.view=\'settings\';render()">设置</button>'+
    '<button class="btn btn-secondary" style="padding:4px 8px;font-size:12px;margin-left:4px" onclick="doLock()">锁定</button>'+
    '</div></div>';
  html+='<div class="card"><b style="font-size:14px">点击记录</b><div class="grid" style="margin-top:12px">';
  ts.forEach(function(t){
    html+='<div class="tpl" onclick="openRecord(\''+t.id+'\')">'+
      (t.image?'<div class="tpl-icon"><img src="'+t.image+'"></div>':'<div class="tpl-icon">'+esc(t.icon)+'</div>')+
      '<div style="font-size:13px;font-weight:500">'+esc(t.name)+'</div>'+
      '<div style="font-size:11px;color:#aaa">'+esc(t.unit||'')+'</div></div>';
  });
  html+='<div class="tpl" style="color:#aaa;display:flex;flex-direction:column;align-items:center;justify-content:center" onclick="openTemplate(null)">'+
    '<div style="font-size:24px">＋</div><div style="font-size:12px">新建</div></div>';
  html+='</div></div>';
  html+='<div class="card"><b style="font-size:14px">记录</b>';
  if(!rs.length) html+='<p class="empty">还没有记录，点击上面的卡片开始</p>';
  else {
    order.forEach(function(k){
      html+='<div style="margin-top:12px"><div style="font-size:12px;color:#aaa">'+fmtDay(k)+'</div>';
      groups[k].forEach(function(r){ html+=recordRow(r); });
      html+='</div>';
    });
    if (untimed.length) {
      html+='<div style="margin-top:12px"><div style="font-size:12px;color:#aaa">无时间</div>';
      untimed.forEach(function(r){ html+=recordRow(r); });
      html+='</div>';
    }
  }
  html+='</div>';
  return html;
}
function recordRow(r){
  var t=state.data.templates.filter(function(x){return x.id===r.templateId;})[0]; if(!t) return '';
  var prec = t.precision || 'minute';
  var amt=(r.amount!==null && r.amount!==undefined)?'<b>'+fmtNum(r.amount)+(t.unit||'')+'</b>':'';
  var timeHtml = '';
  if (r.at) {
    if (prec === 'minute') timeHtml = '<div style="font-size:12px;color:#aaa;width:40px;flex-shrink:0;padding-top:4px">'+fmtTime(r.at)+'</div>';
    else if (prec === 'hour') timeHtml = '<div style="font-size:12px;color:#aaa;width:40px;flex-shrink:0;padding-top:4px">'+pad(new Date(r.at).getHours())+'时</div>';
    else timeHtml = '<div style="font-size:12px;color:#aaa;width:40px;flex-shrink:0;padding-top:4px">·</div>';
  } else {
    timeHtml = '<div style="font-size:12px;color:#ccc;width:40px;flex-shrink:0;padding-top:4px">—</div>';
  }
  return '<div class="record-item">'+ timeHtml +
    (t.image?'<div class="rec-icon"><img src="'+t.image+'"></div>':'<div class="rec-icon">'+esc(t.icon)+'</div>')+
    '<div style="flex:1;min-width:0;padding-top:2px">'+
    '<div style="font-size:14px">'+esc(t.name)+' '+amt+'</div>'+
    (r.content?'<div style="font-size:12px;color:#888;word-break:break-all">'+esc(r.content)+'</div>':'')+
    '</div>'+
    '<button class="btn btn-danger" style="padding:4px 8px;font-size:11px;flex-shrink:0" onclick="if(confirm(\'删除这条记录？\')){state.data.records=state.data.records.filter(function(x){return x.id!==\''+r.id+'\';});saveData();render();}">删</button>'+
    '</div>';
}
function renderStats(){
  var quick = [
    ['today','今日'],['week','本周'],['month','本月'],
    ['7days','最近7天'],['30days','最近30天'],
    ['all','全部'],['custom','自定义']
  ];
  var html='<div class="header"><b>统计</b><button class="btn btn-secondary" style="padding:4px 8px;font-size:12px" onclick="state.view=\'home\';render()">返回</button></div>';
  html+='<div class="range-wrap">';
  quick.forEach(function(r){
    html+='<button class="range-btn'+(state.range===r[0]?' active':'')+'" onclick="setRange(\''+r[0]+'\')">'+r[1]+'</button>';
  });
  html+='</div>';
  if (state.range === 'custom') {
    html+='<div class="custom-range show"><span>从</span><input type="date" class="inp" value="'+esc(state.customFrom)+'" onchange="setCustomFrom(this.value)">'+
      '<span>到</span><input type="date" class="inp" value="'+esc(state.customTo)+'" onchange="setCustomTo(this.value)"></div>';
  }
  var stats=buildStats();
  if(!stats.length){ html+='<div class="card"><p class="empty">这段时间还没有带数值的记录</p></div>'; return html; }
  stats.forEach(function(s){
    html+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px">'+
      '<div style="font-size:15px;color:#666">'+esc(s.unit)+'</div>'+
      '<div><span style="font-size:24px;font-weight:600">'+fmtNum(s.total)+'</span>'+
      '<span style="font-size:13px;color:#888;margin-left:4px">'+esc(s.unit)+'</span></div></div>';
    s.items.forEach(function(it){
      var pct=s.total>0?(it.sum/s.total*100):0;
      html+='<div class="stat-row"><div class="stat-label"><span>'+esc(it.icon)+' '+esc(it.name)+' <span class="tag">'+it.count+'笔</span></span>'+
        '<span><b>'+fmtNum(it.sum)+'</b> '+esc(s.unit)+' <span style="color:#aaa;margin-left:4px">'+Math.round(pct)+'%</span></span></div>'+
        '<div class="stat-bar"><div class="stat-bar-fill" style="width:'+pct+'%"></div></div></div>';
    });
    html+='</div>';
  });
  return html;
}
function renderSettings(){
  var ts=state.data.templates;
  var html='<div class="header"><b>设置</b><button class="btn btn-secondary" style="padding:4px 8px;font-size:12px" onclick="state.view=\'home\';render()">返回</button></div>';
  html+='<div class="card"><b style="font-size:14px">我的模板</b>';
  ts.forEach(function(t){
    var pl = PREC_LABEL[t.precision] || '分钟';
    html+='<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0">'+
      (t.image?'<div class="rec-icon"><img src="'+t.image+'"></div>':'<div class="rec-icon">'+esc(t.icon)+'</div>')+
      '<div style="flex:1;font-size:14px">'+esc(t.name)+' <span class="tag">'+esc(t.unit||'')+' · '+pl+'</span></div>'+
      '<button class="btn btn-secondary" style="padding:4px 8px;font-size:12px" onclick="openTemplate(\''+t.id+'\')">编辑</button>'+
      '<button class="btn btn-danger" style="padding:4px 8px;font-size:12px;margin-left:4px" onclick="delTemplate(\''+t.id+'\')">删除</button></div>';
  });
  html+='<button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="openTemplate(null)">+ 新建模板</button></div>';
  return html;
}

function renderModal(){
  var mr=document.getElementById('modalRoot');
  var m=state.modal;
  if(!m){ mr.innerHTML=''; return; }
  var html='<div class="mask" onclick="if(event.target===this) closeModal()"><div class="modal" onclick="event.stopPropagation()">';
  if(m.type==='record'){
    var t=m.template;
    var prec = t.precision || 'minute';
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'+
      (t.image?'<div class="rec-icon"><img src="'+t.image+'"></div>':'<div class="rec-icon">'+esc(t.icon)+'</div>')+
      '<b>'+esc(t.name)+'</b><button class="btn btn-secondary" style="margin-left:auto;padding:4px 8px;font-size:12px" onclick="closeModal()">✕</button></div>';
    if(t.amountEnabled) html+='<input id="recAmt" class="inp" type="number" step="any" placeholder="数值（'+(t.unit||'')+'）">';
    if(t.contentEnabled) html+='<input id="recCon" class="inp" placeholder="'+(t.contentHint||'内容')+'">';
    html += renderTimeInput(prec, null);
    html+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-secondary" style="flex:1" onclick="closeModal()">取消</button><button class="btn btn-primary" style="flex:1" onclick="saveRecord()">保存</button></div>';
  }
  else if(m.type==='template'){
    var t=m.template;
    var prec = t.precision || 'minute';
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><b>'+(t.id?'编辑':'新建')+'模板</b><button class="btn btn-secondary" style="margin-left:auto;padding:4px 8px;font-size:12px" onclick="closeModal()">✕</button></div>';
    html+='<div style="margin-bottom:12px"><div style="font-size:12px;color:#888;margin-bottom:8px">图标</div>'+
      '<div style="display:flex;align-items:center;gap:12px">'+
      '<div class="icon-preview">'+(t.image?'<img src="'+t.image+'">':esc(t.icon))+'</div>'+
      '<div style="display:flex;flex-direction:column;gap:6px">'+
      '<button class="btn btn-secondary" style="padding:6px 12px;font-size:13px" onclick="document.getElementById(\'iconFile\').click()">上传图片</button>'+
      (t.image?'<button class="btn btn-secondary" style="padding:6px 12px;font-size:13px" onclick="clearIcon()">改用 Emoji</button>':'')+
      '</div></div><input type="file" id="iconFile" accept="image/*" style="display:none">'+
      '<div style="font-size:11px;color:#aaa;margin-top:6px">图片自动裁剪成正方形并压缩到 96×96</div></div>';
    html+='<input id="tplName" class="inp" value="'+esc(t.name)+'" placeholder="名称（如：午饭）">';
    html+='<input id="tplIcon" class="inp" value="'+esc(t.icon)+'" placeholder="Emoji（如：🍚，上传图片后忽略）">';
    html+='<input id="tplUnit" class="inp" value="'+esc(t.unit)+'" placeholder="单位（如：元、公里、小时）">';
    html+='<label style="display:block;font-size:13px;color:#666;margin-bottom:6px">时间精度</label>';
    html+='<select id="tplPrec" class="inp">'+
      '<option value="minute" '+(prec==='minute'?'selected':'')+'>精确到分钟</option>'+
      '<option value="hour" '+(prec==='hour'?'selected':'')+'>精确到小时</option>'+
      '<option value="day" '+(prec==='day'?'selected':'')+'>只记日期</option>'+
      '<option value="month" '+(prec==='month'?'selected':'')+'>只记月份</option>'+
      '<option value="year" '+(prec==='year'?'selected':'')+'>只记年份</option>'+
      '<option value="none" '+(prec==='none'?'selected':'')+'>不记录时间</option>'+
      '</select>';
    html+='<label style="display:block;font-size:14px;margin:8px 0"><input type="checkbox" id="tplAmt" '+(t.amountEnabled?'checked':'')+'> 记录数值</label>';
    html+='<label style="display:block;font-size:14px;margin:8px 0"><input type="checkbox" id="tplCon" '+(t.contentEnabled?'checked':'')+'> 记录内容</label>';
    html+='<div style="font-size:11px;color:#888;margin-bottom:8px">数值和内容至少启用一个</div>';
    html+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-secondary" style="flex:1" onclick="closeModal()">取消</button><button class="btn btn-primary" style="flex:1" onclick="saveTemplate()">保存</button></div>';
  }
  else if(m.type==='newAccount'){
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><b>新建账号</b><button class="btn btn-secondary" style="margin-left:auto;padding:4px 8px;font-size:12px" onclick="closeModal()">✕</button></div>';
    html+='<input id="newAccName" class="inp" placeholder="账号名称（如：演示、日常工作）">';
    html+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-secondary" style="flex:1" onclick="closeModal()">取消</button><button class="btn btn-primary" style="flex:1" onclick="doNewAccount()">创建</button></div>';
    setTimeout(function(){ var el=document.getElementById('newAccName'); if(el) el.focus(); },50);
  }
  else if(m.type==='renameAccount'){
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><b>重命名账号</b><button class="btn btn-secondary" style="margin-left:auto;padding:4px 8px;font-size:12px" onclick="closeModal()">✕</button></div>';
    html+='<input id="renAccName" class="inp" value="'+esc(m.name)+'">';
    html+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-secondary" style="flex:1" onclick="closeModal()">取消</button><button class="btn btn-primary" style="flex:1" onclick="doRenameAccount()">保存</button></div>';
    setTimeout(function(){ var el=document.getElementById('renAccName'); if(el) el.focus(); },50);
  }
  else if(m.type==='changePin'){
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><b>修改 PIN</b><button class="btn btn-secondary" style="margin-left:auto;padding:4px 8px;font-size:12px" onclick="closeModal()">✕</button></div>';
    html+='<input id="oldPin" class="inp" type="password" inputmode="numeric" placeholder="当前 PIN">';
    html+='<input id="newPin1" class="inp" type="password" inputmode="numeric" placeholder="新 PIN（至少 4 位）">';
    html+='<input id="newPin2" class="inp" type="password" inputmode="numeric" placeholder="再次输入新 PIN">';
    html+='<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-secondary" style="flex:1" onclick="closeModal()">取消</button><button class="btn btn-primary" style="flex:1" onclick="doChangePin()">保存</button></div>';
  }
  html+='</div></div>';
  mr.innerHTML=html;
  var f=document.getElementById('iconFile');
  if(f) f.addEventListener('change',function(e){ handleIconUpload(e.target.files&&e.target.files[0]); e.target.value=''; });
}

function doNewAccount(){
  var name=document.getElementById('newAccName').value.trim();
  if(!name) return alert('请输入账号名称');
  var acc=createAccount(name);
  if(state.currentAccountId) saveData();
  loadData(acc.id);
  closeModal(); state.view='home'; render();
}
function doRenameAccount(){
  var name=document.getElementById('renAccName').value.trim();
  if(!name) return alert('请输入名称');
  renameAccount(state.modal.id, name);
  closeModal(); render();
}
function doChangePin(){
  var oldP=document.getElementById('oldPin').value;
  var n1=document.getElementById('newPin1').value;
  var n2=document.getElementById('newPin2').value;
  if(!checkPin(oldP)) return alert('当前 PIN 不正确');
  if(n1.length<4) return alert('新 PIN 至少 4 位');
  if(n1!==n2) return alert('两次输入不一致');
  setPin(n1);
  closeModal();
  alert('PIN 已修改');
}

/* ============ 启动 ============ */
(function init(){
  loadAccounts();
  if(!hasPin()) state.view='setup';
  else state.view='lock';
  render();
})();
</script>
</body>
</html>
