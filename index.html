<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeLog</title>
<style>
  :root{
    --bg:#f8f9fa; --card:#fff; --border:#ddd;
    --text:#333; --text-dim:#888; --text-faint:#aaa;
    --btn-p-bg:#0f172a; --btn-p-text:#fff;
    --btn-s-bg:#e2e8f0; --btn-s-text:#333;
    --inp-bg:#fff; --inp-border:#ccc;
    --tag-bg:#f1f5f9; --tag-text:#666;
    --bar-bg:#f1f5f9; --bar-fill:#0f172a; --bar-fill-alt:#94a3b8;
    --row-border:#f0f0f0; --soft-bg:#f8f9fa;
    --range-in:#e0e7ff; --range-in-text:#3730a3;
  }
  body[data-theme="night"]{
    --bg:#1a1a1a; --card:#262626; --border:#3a3a3a;
    --text:#e5e5e5; --text-dim:#9a9a9a; --text-faint:#6a6a6a;
    --btn-p-bg:#e5e5e5; --btn-p-text:#1a1a1a;
    --btn-s-bg:#3a3a3a; --btn-s-text:#e5e5e5;
    --inp-bg:#2e2e2e; --inp-border:#444;
    --tag-bg:#3a3a3a; --tag-text:#aaa;
    --bar-bg:#3a3a3a; --bar-fill:#e5e5e5; --bar-fill-alt:#666;
    --row-border:#333; --soft-bg:#2e2e2e;
    --range-in:#3a3a5a; --range-in-text:#c5c5e5;
  }
  body[data-theme="eye"]{
    --bg:#f5eedd; --card:#fbf5e6; --border:#e0d5bb;
    --text:#4a4032; --text-dim:#8a7d66; --text-faint:#a89a80;
    --btn-p-bg:#4a4032; --btn-p-text:#fbf5e6;
    --btn-s-bg:#ebe2cc; --btn-s-text:#4a4032;
    --inp-bg:#fbf5e6; --inp-border:#d0c4a8;
    --tag-bg:#ebe2cc; --tag-text:#8a7d66;
    --bar-bg:#ebe2cc; --bar-fill:#4a4032; --bar-fill-alt:#a89a80;
    --row-border:#ebe2cc; --soft-bg:#f0e8d5;
    --range-in:#d8caa8; --range-in-text:#4a4032;
  }
  body{font-family:sans-serif;background-color:var(--bg);margin:0;padding:16px;color:var(--text);min-height:100vh}
  .container{max-width:600px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .btn{border:none;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--btn-p-bg);color:var(--btn-p-text)}
  .btn-primary:hover{opacity:.85}
  .btn-secondary{background:var(--btn-s-bg);color:var(--btn-s-text)}
  .btn-secondary:hover{opacity:.85}
  .btn-danger{background:#fee2e2;color:#b91c1c}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tpl{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
  .tpl:hover{border-color:var(--text-faint);box-shadow:0 2px 8px rgba(0,0,0,0.08)}
  .tpl-icon{width:40px;height:40px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;border-radius:8px}
  .tpl-icon img{width:100%;height:100%;object-fit:cover}
  .inp{width:100%;border:1px solid var(--inp-border);border-radius:8px;padding:10px;margin-bottom:12px;font-size:14px;box-sizing:border-box;outline:none;background:var(--inp-bg);color:var(--text);font-family:inherit}
  .inp:focus{border-color:var(--text-dim)}
  .inp-with-badge{padding-right:110px !important}
  .prec-badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-faint);background:var(--tag-bg);padding:2px 8px;border-radius:10px;white-space:nowrap;pointer-events:none}
  .rec-time{font-size:12px;color:var(--text-faint);width:44px;flex-shrink:0;padding-top:4px}
  .record-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--row-border);align-items:flex-start}
  .record-item:last-child{border-bottom:none}
  .rec-icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;border-radius:6px}
  .rec-icon img{width:100%;height:100%;object-fit:cover}
  .mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999}
  .modal{background:var(--card);color:var(--text);border-radius:12px;padding:20px;width:90%;max-width:400px;max-height:90vh;overflow-y:auto}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:6px}
  .empty{text-align:center;color:var(--text-faint);padding:20px 0;font-size:14px}
  .tag{font-size:11px;color:var(--text-faint)}
  .tag-badge{display:inline-block;font-size:11px;background:var(--btn-p-bg);color:var(--btn-p-text);padding:1px 8px;border-radius:10px;margin-left:6px}
  .icon-preview{width:56px;height:56px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;flex-shrink:0}
  .icon-preview img{width:100%;height:100%;object-fit:cover}
  .stat-row{margin-bottom:10px}
  .stat-row:last-child{margin-bottom:0}
  .stat-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .stat-bar{height:6px;background:var(--bar-bg);border-radius:3px;overflow:hidden}
  .stat-bar-fill{height:100%;background:var(--bar-fill);border-radius:3px}
  .stat-bar-fill.alt{background:var(--bar-fill-alt)}
  .pin-wrap{text-align:center;margin-top:80px}
  .pin-wrap h1{font-size:24px;margin-bottom:8px}
  .pin-wrap p{color:var(--text-dim);font-size:14px;margin-bottom:20px}
  .pin-card{text-align:left;max-width:320px;margin:0 auto}
  .err{color:#e11d48;font-size:12px;margin-bottom:8px}
  .time-hint{font-size:12px;color:var(--text-dim);padding:8px;background:var(--soft-bg);border-radius:8px;margin-bottom:12px}
  .card-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .card-title-label{font-size:15px;color:var(--text-dim)}
  .card-title-total{font-size:24px;font-weight:600}
  .card-title-unit{font-size:13px;color:var(--text-dim);margin-left:4px;font-weight:400}
  .stat-tabs{display:flex;gap:6px;margin-bottom:16px}
  .stat-tab{flex:1;padding:8px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);text-align:center}
  .stat-tab.active{background:var(--btn-p-bg);color:var(--btn-p-text);border-color:var(--btn-p-bg)}
  .cal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;user-select:none}
  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .cal-header button{background:none;border:none;font-size:20px;cursor:pointer;padding:2px 10px;color:var(--text-dim);border-radius:6px}
  .cal-header button:hover{background:var(--soft-bg)}
  .cal-header .cal-title{display:flex;gap:4px;font-size:14px;font-weight:500}
  .cal-header .cal-title select{border:none;background:transparent;font-size:14px;font-weight:500;cursor:pointer;outline:none;padding:2px;color:var(--text);font-family:inherit}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-faint);margin-bottom:4px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;touch-action:none}
  .cal-day{text-align:center;padding:8px 0;font-size:13px;cursor:pointer;border-radius:6px;color:var(--text);transition:.05s}
  .cal-day:hover{background:var(--soft-bg)}
  .cal-day.empty{visibility:hidden;cursor:default}
  .cal-day.today{font-weight:700}
  .cal-day.in-range{background:var(--range-in);color:var(--range-in-text);border-radius:0}
  .cal-day.range-start{background:var(--btn-p-bg);color:var(--btn-p-text);border-radius:6px 0 0 6px}
  .cal-day.range-end{background:var(--btn-p-bg);color:var(--btn-p-text);border-radius:0 6px 6px 0}
  .cal-day.range-start.range-end{border-radius:6px}
  .cal-day.range-start.today,.cal-day.range-end.today{color:var(--btn-p-text)}
  .cal-wrap{display:grid;gap:12px}
  .cal-wrap.double{grid-template-columns:1fr 1fr}
  @media (max-width:520px){ .cal-wrap.double{grid-template-columns:1fr} }
  .range-info{font-size:13px;color:var(--text);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;padding:0 4px}
  .range-info .clear-btn{background:none;border:none;color:var(--text-faint);font-size:12px;cursor:pointer;padding:4px}
  .content-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .content-tab{padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text)}
  .content-tab.active{background:var(--btn-p-bg);color:var(--btn-p-text);border-color:var(--btn-p-bg)}
  .content-view-toggle{display:flex;gap:4px;margin-bottom:14px;background:var(--tag-bg);padding:3px;border-radius:8px;width:fit-content}
  .content-view-toggle button{border:none;background:transparent;padding:6px 14px;font-size:13px;cursor:pointer;border-radius:6px;color:var(--text-dim);font-family:inherit}
  .content-view-toggle button.active{background:var(--card);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,0.06)}
  .cloud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;padding:8px 0;line-height:1.3}
  .cloud-word{color:var(--text);font-weight:500}
  .cloud-word sup{font-size:0.55em;color:var(--text-faint);font-weight:400;margin-left:3px;vertical-align:super}
  .content-list-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--row-border);font-size:14px}
  .content-list-item:last-child{border-bottom:none}
  .content-list-date{color:var(--text-faint);font-size:12px;width:64px;flex-shrink:0;padding-top:2px}
  .content-list-text{flex:1;word-break:break-all}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .link-btn{background:none;border:none;color:var(--text);font-size:13px;cursor:pointer;padding:4px}

  /* 主题选择 */
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .theme-opt{border:2px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;text-align:center;font-size:13px;color:var(--text)}
  .theme-opt.active{border-color:var(--btn-p-bg)}
  .theme-swatch{height:36px;border-radius:6px;margin-bottom:6px;border:1px solid rgba(0,0,0,0.08)}

  /* 生活名言 */
  .quote-box{
    text-align:center;
    padding:14px 22px;
    font-style:italic;
    color:var(--text-dim);
    font-size:14px;
    line-height:1.7;
    margin-bottom:16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    position:relative;
  }
  .quote-box::before{
    content:'「';
    color:var(--text-faint);
    position:absolute;
    left:10px;
    top:6px;
    font-size:18px;
    font-style:normal;
  }
  .quote-box::after{
    content:'」';
    color:var(--text-faint);
    position:absolute;
    right:10px;
    bottom:4px;
    font-size:18px;
    font-style:normal;
  }
</style>
</head>
<body>
<div id="app" class="container"></div>
<div id="modalRoot"></div>

<script>
/* ============ 启动时立即应用主题 ============ */
(function applyAppearance(){
  try {
    // 清理旧版壁纸数据（此版本已移除壁纸功能）
    localStorage.removeItem('lifelog_wallpaper');
    var theme = localStorage.getItem('lifelog_theme') || 'light';
    document.body.setAttribute('data-theme', theme);
  } catch(e) {}
})();

/* ============ 工具 ============ */
var PIN_KEY='lifelog_pin', ACC_KEY='lifelog_accounts', LAST_KEY='lifelog_last_account';
function $(s){ return document.querySelector(s); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hash(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return 'h'+(h>>>0).toString(36); }
function pad(n){ return n<10?'0'+n:''+n; }
function fmtTime(iso){ var d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function dayKey(iso){ var d=new Date(iso); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDay(k){ var t=dayKey(new Date().toISOString()),y=dayKey(new Date(Date.now()-86400000).toISOString()); if(k===t)return'今天'; if(k===y)return'昨天'; var p=k.split('-'); return parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日'; }
function fmtNum(n){ var x=Number(n); if(!isFinite(x)) return '0'; return String(Math.round(x*100)/100); }
function LSread(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function LSwrite(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ alert('保存失败，可能浏览器空间不足'); } }
function dataKey(id){ return 'lifelog_data_'+id; }
function normalizeMonth(y,m){ while(m<0){m+=12;y--;} while(m>11){m-=12;y++;} return {year:y,month:m}; }
function todayStr(){ return dayKey(new Date().toISOString()); }
function firstOfMonthStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01'; }

var PREC_LABEL = {
  minute:'精确到分钟', hour:'精确到小时', day:'精确到日',
  month:'精确到月份', year:'精确到年份', none:'不记录时间'
};
var HINT_BY_PREC = {
  minute:'如：2026/8/23 12:30 或 今天 12:30',
  hour:  '如：2026/8/23 12 或 今天 12',
  day:   '如：2026/8/23 或 今天',
  month: '如：2026/8 或 8月',
  year:  '如：2026',
  none:  ''
};

function fmtTimeByPrec(iso, precision){
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var y = d.getFullYear();
  var mo = pad(d.getMonth()+1);
  var dd = pad(d.getDate());
  var h = pad(d.getHours());
  var mi = pad(d.getMinutes());
  if (precision === 'year') return String(y);
  if (precision === 'month') return y+'/'+mo;
  if (precision === 'day') return y+'/'+mo+'/'+dd;
  if (precision === 'hour') return y+'/'+mo+'/'+dd+' '+h;
  if (precision === 'minute') return y+'/'+mo+'/'+dd+' '+h+':'+mi;
  return '';
}
function cropByPrec(d, precision){
  var y = d.getFullYear(), mo = d.getMonth(), dd = d.getDate(), h = d.getHours(), mi = d.getMinutes();
  if (precision === 'year') { mo = 0; dd = 1; h = 0; mi = 0; }
  else if (precision === 'month') { dd = 1; h = 0; mi = 0; }
  else if (precision === 'day') { h = 12; mi = 0; }
  else if (precision === 'hour') { mi = 0; }
  return new Date(y, mo, dd, h, mi, 0, 0);
}
function cnNumToArabic(str){
  var map = { '零':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9 };
  str = str.replace(/([一二三四五六七八九])?十([一二三四五六七八九])?/g, function(m, a, b){
    var tens = a ? map[a] : 1;
    var ones = b ? map[b] : 0;
    return String(tens * 10 + ones);
  });
  str = str.replace(/[一二三四五六七八九零]/g, function(c){ return map[c]; });
  return str;
}
function parseTimeText(text, precision){
  if (precision === 'none') return null;
  text = String(text||'').trim();
  var now = new Date();
  var y = now.getFullYear(), mo = now.getMonth(), dd = now.getDate();
  var h = now.getHours(), mi = now.getMinutes();
  if (!text) return cropByPrec(new Date(y,mo,dd,h,mi), precision).toISOString();

  if (/今天/.test(text)) { }
  else if (/昨天/.test(text)) { var n1 = new Date(); n1.setDate(n1.getDate()-1); y=n1.getFullYear(); mo=n1.getMonth(); dd=n1.getDate(); }
  else if (/前天/.test(text)) { var n2 = new Date(); n2.setDate(n2.getDate()-2); y=n2.getFullYear(); mo=n2.getMonth(); dd=n2.getDate(); }

  text = cnNumToArabic(text);

  var timeMatch = text.match(/(\d{1,2})\s*[:点]\s*(\d{1,2})?\s*分?/);
  if (timeMatch) {
    h = parseInt(timeMatch[1], 10);
    if (timeMatch[2]) mi = parseInt(timeMatch[2], 10);
    text = text.replace(timeMatch[0], ' ');
  }

  var yearMatch  = text.match(/(\d{1,4})\s*年/);
  var monthMatch = text.match(/(\d{1,2})\s*月/);
  var dayMatch   = text.match(/(\d{1,2})\s*[日号]/);

  if (yearMatch || monthMatch || dayMatch) {
    if (yearMatch) {
      var yv = parseInt(yearMatch[1], 10);
      if (yv < 100) yv = yv >= 70 ? 1900 + yv : 2000 + yv;
      y = yv;
      if (!monthMatch) mo = 0;
      if (!dayMatch)   dd = 1;
    }
    if (monthMatch) {
      mo = parseInt(monthMatch[1], 10) - 1;
      if (!dayMatch) dd = 1;
    }
    if (dayMatch) dd = parseInt(dayMatch[1], 10);
  } else {
    var s = text
      .replace(/[\.\-\/]/g, '/')
      .replace(/[\s，,\u3000]+/g, '/')
      .replace(/\/+/g, '/')
      .replace(/^\/|\/$/g, '');
    var nums = s.split('/').map(function(x){ return parseInt(x,10); }).filter(function(n){ return isFinite(n); });
    if (nums.length === 1) {
      var n = nums[0];
      if (n >= 100) { y = n; mo = 0; dd = 1; }
      else if (n > 31) { y = n >= 70 ? 1900 + n : 2000 + n; mo = 0; dd = 1; }
      else if (n > 12) { dd = n; }
      else { mo = n - 1; dd = 1; }
    } else if (nums.length === 2) {
      if (nums[0] > 12) {
        var yv2 = nums[0];
        if (yv2 < 100) yv2 = yv2 >= 70 ? 1900 + yv2 : 2000 + yv2;
        y = yv2; mo = nums[1] - 1; dd = 1;
      } else {
        mo = nums[0] - 1; dd = nums[1];
      }
    } else if (nums.length >= 3) {
      var yv3 = nums[0];
      if (yv3 < 100) yv3 = yv3 >= 70 ? 1900 + yv3 : 2000 + yv3;
      y = yv3; mo = nums[1] - 1; dd = nums[2];
    }
  }

  var result = new Date(y, mo, dd, h, mi, 0, 0);
  if (isNaN(result.getTime())) return null;
  return cropByPrec(result, precision).toISOString();
}

/* ============ 状态 ============ */
var state = { view:'lock', accounts:[], currentAccountId:null, data:null, modal:null, pinError:'' };

var statState = {
  tab: 'single',
  single: { year: new Date().getFullYear(), month: new Date().getMonth() },
  left:   { year: new Date().getFullYear(), month: new Date().getMonth() },
  right:  (function(){ var n = normalizeMonth(new Date().getFullYear(), new Date().getMonth()+1); return { year:n.year, month:n.month }; })(),
  selStart: firstOfMonthStr(),
  selEnd: todayStr(),
  dragging: false,
  dragOrigin: null,
  contentTemplateId: null,
  contentView: 'cloud'
};

var historyState = {
  tab: 'single',
  single: { year: new Date().getFullYear(), month: new Date().getMonth() },
  left:   { year: new Date().getFullYear(), month: new Date().getMonth() },
  right:  (function(){ var n = normalizeMonth(new Date().getFullYear(), new Date().getMonth()+1); return { year:n.year, month:n.month }; })(),
  selStart: todayStr(),
  selEnd: todayStr(),
  dragging: false,
  dragOrigin: null
};

/* ============ PIN ============ */
function hasPin(){ return !!localStorage.getItem(PIN_KEY); }
function setPin(p){ localStorage.setItem(PIN_KEY, hash(p)); }
function checkPin(p){ return localStorage.getItem(PIN_KEY)===hash(p); }

/* ============ 主题 ============ */
function getTheme(){ return localStorage.getItem('lifelog_theme') || 'light'; }
function setTheme(t){
  localStorage.setItem('lifelog_theme', t);
  document.body.setAttribute('data-theme', t);
  render();
}

/* ============ 账号 ============ */
function loadAccounts(){ state.accounts = LSread(ACC_KEY, []); }
function saveAccounts(){ LSwrite(ACC_KEY, state.accounts); }
function getAccount(id){ return state.accounts.filter(function(a){return a.id===id;})[0]||null; }
function createAccount(name){
  var acc = { id:uid(), name:name, createdAt:new Date().toISOString() };
  state.accounts.push(acc); saveAccounts();
  LSwrite(dataKey(acc.id), { templates:defaultTemplates(), records:[], quote:'' });
  return acc;
}
function deleteAccount(id){
  state.accounts = state.accounts.filter(function(a){return a.id!==id;});
  saveAccounts(); localStorage.removeItem(dataKey(id));
  if(state.currentAccountId===id){ state.currentAccountId=null; state.data=null; LSwrite(LAST_KEY,null); }
}

function saveRecord(){
  var m=state.modal; if(!m) return;
  var t=m.template;
  var prec = t.precision || 'minute';
  var aEl=document.getElementById('recAmt'), cEl=document.getElementById('recCon'), atEl=document.getElementById('recAt');
  var amount = aEl?aEl.value.trim():'';
  var content = cEl?cEl.value.trim():'';

  var at;
  if (prec === 'none') {
    at = null;
  } else {
    var text = atEl ? atEl.value.trim() : '';
    at = parseTimeText(text, prec);
    if (at === null) { alert('时间格式无法识别，请重新输入'); return; }
    var parsedDate = new Date(at);
    var todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
    if (parsedDate.getTime() > todayEnd.getTime()) {
      alert('不能记录未来的时间。\n今天：' + todayStr() + '\n输入解析为：' + fmtTimeByPrec(at, 'day'));
      return;

  }
  state.data.records.push({
    id:uid(), templateId:t.id, at: at,

function handleIconUpload(file){
  if(!file) return;
  if(file.size>10*1024*1024){ alert('图片太大了，请选择 10MB 以内的图片'); return; }
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas'); c.width=96; c.height=96;
      var ctx=c.getContext('2d');
      var min=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,96,96);
      state.modal.template.image=c.toDataURL('image/png');
      renderModal();
    };
    img.onerror=function(){ alert('图片加载失败'); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============ 日历交互 ============ */
function getCalState(ctx){ return ctx === 'stat' ? statState : historyState; }
var activeDragCtx = null;

function setStatTab(t){ statState.tab = t; render(); }
function setHistoryTab(t){ historyState.tab = t; render(); }

function calPrev(ctx, which){
  var s = getCalState(ctx);
  var o = which==='single' ? s.single : which==='left' ? s.left : s.right;
  o.month -= 1;
  var n = normalizeMonth(o.year, o.month);
  o.year = n.year; o.month = n.month;
  render();
}
function calNext(ctx, which){
  var s = getCalState(ctx);
  var o = which==='single' ? s.single : which==='left' ? s.left : s.right;
  o.month += 1;
  var n = normalizeMonth(o.year, o.month);
  o.year = n.year; o.month = n.month;
  render();
}
function calSetYear(ctx, which, v){
  var s = getCalState(ctx);
  var o = which==='single' ? s.single : which==='left' ? s.left : s.right;
  o.year = parseInt(v,10); render();
}
function calSetMonth(ctx, which, v){
  var s = getCalState(ctx);
  var o = which==='single' ? s.single : which==='left' ? s.left : s.right;
  o.month = parseInt(v,10); render();
}
function calDayDown(ctx, dateStr){
  var s = getCalState(ctx);
  s.dragOrigin = dateStr;
  s.dragging = true;
  s.selStart = dateStr;
  s.selEnd = dateStr;
  render();
}
function calDayEnter(ctx, dateStr){
  var s = getCalState(ctx);
  if (!s.dragging || !s.dragOrigin) return;
  if (dateStr >= s.dragOrigin) { s.selStart = s.dragOrigin; s.selEnd = dateStr; }
  else { s.selStart = dateStr; s.selEnd = s.dragOrigin; }
  render();
}
function clearStatSel(){
  statState.selStart = null; statState.selEnd = null;
  statState.dragging = false; statState.dragOrigin = null;
  render();
}
function clearHistorySel(){
  historyState.selStart = null; historyState.selEnd = null;
  historyState.dragging = false; historyState.dragOrigin = null;
  render();
}
document.addEventListener('pointerup', function(){
  if (activeDragCtx) {
    var s = getCalState(activeDragCtx);
    s.dragging = false;
    activeDragCtx = null;
  }
});
document.addEventListener('pointerdown', function(e){
  var el = e.target.closest && e.target.closest('[data-cal-date]');
  if (!el) return;
  e.preventDefault();
  activeDragCtx = el.dataset.calCtx;
  calDayDown(activeDragCtx, el.dataset.calDate);
});
document.addEventListener('pointermove', function(e){
  if (!activeDragCtx) return;
  var s = getCalState(activeDragCtx);
  if (!s.dragging) return;
  var el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.dataset && el.dataset.calDate) calDayEnter(activeDragCtx, el.dataset.calDate);
});

function renderCalendar(ctx, which, year, month){
  var s = getCalState(ctx);
  var first = new Date(year, month, 1);
  var startWeekday = (first.getDay() + 6) % 7;
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var tds = todayStr();

  var yearOpts = '';
  for (var y=year-5; y<=year+5; y++) yearOpts += '<option value="'+y+'"'+(y===year?' selected':'')+'>'+y+'年</option>';
  var monthOpts = '';
  for (var m=0;m<12;m++) monthOpts += '<option value="'+m+'"'+(m===month?' selected':'')+'>'+(m+1)+'月</option>';

  var html = '<div class="cal">';
  html += '<div class="cal-header">'+
    '<button type="button" onclick="calPrev(\''+ctx+'\',\''+which+'\')">‹</button>'+
    '<div class="cal-title">'+
    '<select onchange="calSetYear(\''+ctx+'\',\''+which+'\', this.value)">'+yearOpts+'</select>'+
    '<select onchange="calSetMonth(\''+ctx+'\',\''+which+'\', this.value)">'+monthOpts+'</select>'+
    '</div>'+
    '<button type="button" onclick="calNext(\''+ctx+'\',\''+which+'\')">›</button>'+
    '</div>';
  html += '<div class="cal-week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>';
  html += '<div class="cal-grid">';
  for (var i=0;i<startWeekday;i++) html += '<div class="cal-day empty"></div>';
  for (var d=1;d<=daysInMonth;d++) {
    var dateStr = year+'-'+pad(month+1)+'-'+pad(d);
    var cls = 'cal-day';
    if (dateStr === tds) cls += ' today';
    if (s.selStart && s.selEnd && dateStr >= s.selStart && dateStr <= s.selEnd) cls += ' in-range';
    if (dateStr === s.selStart) cls += ' range-start';
    if (dateStr === s.selEnd) cls += ' range-end';
    html += '<div class="'+cls+'" data-cal-date="'+dateStr+'" data-cal-ctx="'+ctx+'">'+d+'</div>';
  }
  html += '</div></div>';
  return html;
}
function fmtRangeInfo(s){
  if (!s.selStart) return '未选择区间';
  var a = s.selStart, b = s.selEnd || s.selStart;
  var d1 = new Date(a+'T00:00:00'), d2 = new Date(b+'T00:00:00');
  var days = Math.round((d2-d1)/86400000) + 1;
  var fmt = function(d){
    var y = d.getFullYear();
    var thisY = new Date().getFullYear();
    var prefix = (y===thisY) ? '' : y+'年';
    return prefix + (d.getMonth()+1)+'月'+d.getDate()+'日';
  };
  return fmt(d1) + ' — ' + fmt(d2) + ' · 共 ' + days + ' 天';
}

function getStatBounds(){
  var s = statState;
  if (!s.selStart) return [0, Date.now()];
  var a = new Date(s.selStart + 'T00:00:00').getTime();
  var b = s.selEnd ? new Date(s.selEnd + 'T23:59:59').getTime() : new Date(s.selStart + 'T23:59:59').getTime();
  return [a, b];
}
function getHistoryBounds(){
  var s = historyState;
  if (!s.selStart) return [0, Date.now()];
  var a = new Date(s.selStart + 'T00:00:00').getTime();
  var b = s.selEnd ? new Date(s.selEnd + 'T23:59:59').getTime() : new Date(s.selStart + 'T23:59:59').getTime();
  return [a, b];
}
function filterRecordsInBounds(from, to){
  return state.data.records.filter(function(r){
    if (r.at === null || r.at === undefined || r.at === '') return false;
    var t = new Date(r.at).getTime();
    return t >= from && t <= to;
  });
}
function buildAmountStats(rs){
  var byUnit={};
  rs.forEach(function(r){
    var t=state.data.templates.filter(function(x){return x.id===r.templateId;})[0];
    if(!t || r.amount===null || r.amount===undefined || r.amount==='') return;
    var u=t.unit && t.unit.trim() ? t.unit.trim() : '（无单位）';
    if(!byUnit[u]) byUnit[u]={ total:0, items:{} };
    if(!byUnit[u].items[t.id]) byUnit[u].items[t.id]={ name:t.name, icon:t.icon, image:t.image, sum:0, count:0 };
    var v=Number(r.amount)||0;
    byUnit[u].total+=v; byUnit[u].items[t.id].sum+=v; byUnit[u].items[t.id].count+=1;
  });
  var result=[];
  Object.keys(byUnit).forEach(function(u){
    var arr=Object.keys(byUnit[u].items).map(function(k){ return byUnit[u].items[k]; });
    arr.sort(function(a,b){ return b.sum-a.sum; });
    result.push({ unit:u, total:byUnit[u].total, items:arr });
  });
  result.sort(function(a,b){ return b.total-a.total; });
  return result;
}
function buildContentStats(rs){
  var byTpl={};
  rs.forEach(function(r){
    var t=state.data.templates.filter(function(x){return x.id===r.templateId;})[0];
    if(!t) return;
    if(!byTpl[t.id]) byTpl[t.id]={ name:t.name, icon:t.icon, image:t.image, count:0, unit:t.unit||'', amountCount:0, contentCount:0 };
    byTpl[t.id].count += 1;
    if (r.amount !== null && r.amount !== undefined && r.amount !== '') byTpl[t.id].amountCount += 1;
    if (r.content) byTpl[t.id].contentCount += 1;
  });
  return Object.keys(byTpl).map(function(k){ return byTpl[k]; }).sort(function(a,b){ return b.count - a.count; });
}
function buildContentCloud(rs, templateId){
  var tokens = {};
  rs.forEach(function(r){
    if (r.templateId !== templateId) return;
    if (!r.content) return;
    var parts = String(r.content).split(/[\s,，、+;；\/和与跟]+/).filter(Boolean);
    parts.forEach(function(p){
      p = p.trim();
      if (!p) return;
      tokens[p] = (tokens[p] || 0) + 1;
    });
  });
  return Object.keys(tokens).map(function(k){ return { word: k, count: tokens[k] }; })
    .sort(function(a,b){ return b.count - a.count; });
}
function buildContentList(rs, templateId){
  return rs.filter(function(r){
    return r.templateId === templateId && r.content;
  }).sort(function(a,b){ return new Date(b.at) - new Date(a.at); });
}

  html+='<div class="tpl" style="color:var(--text-faint);display:flex;flex-direction:column;align-items:center;justify-content:center" onclick="openTemplate(null)">'+
    '<div style="font-size:24px">＋</div><div style="font-size:12px">新建</div></div>';
  html+='</div></div>';

  html+='<div class="section-head"><b style="font-size:14px">今天的记录</b>'+
    '<button class="link-btn" onclick="state.view=\'history\';render()">查看历史 →</button></div>';

  if (untimedRecs.length) {
    html+='<div class="card"><b style="font-size:14px">无时间的记录</b>';
    untimedRecs.forEach(function(r){ html+=recordRow(r); });
    html+='</div>';
  }
  return html;
}

function renderHistory(){

    '<button class="btn btn-secondary" style="padding:4px 8px;font-size:12px" onclick="state.view=\'home\';render()">返回</button></div>';
  html+='<div class="stat-tabs">'+
    '<div class="stat-tab'+(s.tab==='single'?' active':'')+'" onclick="setHistoryTab(\'single\')">单月选择</div>'+
    '<div class="stat-tab'+(s.tab==='double'?' active':'')+'" onclick="setHistoryTab(\'double\')">跨月选择</div>'+

  if (s.tab === 'single') {
    html += renderCalendar('history', 'single', s.single.year, s.single.month);
    html += '<div class="range-info"><span>'+fmtRangeInfo(s)+'</span>'+
      (s.selStart ? '<button class="clear-btn" onclick="clearHistorySel()">清空</button>' : '')+'</div>';
    html += '<div style="font-size:11px;color:var(--text-faint);margin-bottom:12px;padding:0 4px">点击某天选中当天，按住拖动选中一段区间</div>';
  } else {
    html += '<div class="cal-wrap double">';
    html += renderCalendar('history', 'left', s.left.year, s.left.month);
    html += renderCalendar('history', 'right', s.right.year, s.right.month);
    html += '</div>';
    html += '<div class="range-info"><span>'+fmtRangeInfo(s)+'</span>'+
      (s.selStart ? '<button class="clear-btn" onclick="clearHistorySel()">清空</button>' : '')+'</div>';
    html += '<div style="font-size:11px;color:var(--text-faint);margin-bottom:12px;padding:0 4px">左右两个日历可以独立切换年月</div>';
  }
  var bounds = getHistoryBounds();
  var rs = filterRecordsInBounds(bounds[0], bounds[1]);
  rs.sort(function(a,b){ return new Date(b.at) - new Date(a.at); });
  if(!rs.length){
    html += '<div class="card"><p class="empty">这段时间还没有记录</p></div>';
    return html;
  }
  var groups = {}, order = [];
  rs.forEach(function(r){
    var k = dayKey(r.at);
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(r);
  });
  html += '<div class="card">';
  order.forEach(function(k){
    html += '<div style="margin-top:12px"><div style="font-size:12px;color:var(--text-faint)">'+fmtDay(k)+'</div>';
    groups[k].forEach(function(r){ html += recordRow(r); });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function recordRow(r){
  var t=state.data.templates.filter(function(x){return x.id===r.templateId;})[0]; if(!t) return '';
  var prec = t.precision || 'minute';
  var amt=(r.amount!==null && r.amount!==undefined)?'<b>'+fmtNum(r.amount)+(t.unit||'')+'</b>':'';
  var timeHtml = '';
  if (r.at) {
    if (prec === 'minute') timeHtml = '<div class="rec-time">'+fmtTime(r.at)+'</div>';
    else if (prec === 'hour') timeHtml = '<div class="rec-time">'+pad(new Date(r.at).getHours())+'时</div>';
    else timeHtml = '<div class="rec-time">·</div>';
  } else {
    timeHtml = '<div class="rec-time" style="color:var(--text-faint)">—</div>';
  }
  return '<div class="record-item">'+ timeHtml +
    (t.image?'<div class="rec-icon"><img src="'+t.image+'"></div>':'<div class="rec-icon">'+esc(t.icon)+'</div>')+
    '<div style="flex:1;min-width:0;padding-top:2px">'+
    '<div style="font-size:14px">'+esc(t.name)+' '+amt+'</div>'+
    (r.content?'<div style="font-size:12px;color:var(--text-dim);word-break:break-all">'+esc(r.content)+'</div>':'')+
    '</div>'+
    '<button class="btn btn-danger" style="padding:4px 8px;font-size:11px;flex-shrink:0" onclick="if(confirm(\'删除这条记录？\')){state.data.records=state.data.records.filter(function(x){return x.id!==\''+r.id+'\';});saveData();render();}">删</button>'+
    '</div>';
}

function renderStats(){
  var s = statState;
  var html='<div class="header"><b>统计</b><button class="btn btn-secondary" style="padding:4px 8px;font-size:12px" onclick="state.view=\'home\';render()">返回</button></div>';
  html+='<div class="stat-tabs">'+
    '<div class="stat-tab'+(s.tab==='single'?' active':'')+'" onclick="setStatTab(\'single\')">单月选择</div>'+
    '<div class="stat-tab'+(s.tab==='double'?' active':'')+'" onclick="setStatTab(\'double\')">跨月选择</div>'+
    '</div>';
  if (s.tab === 'single') {
    html += renderCalendar('stat', 'single', s.single.year, s.single.month);
    html += '<div class="range-info"><span>'+fmtRangeInfo(s)+'</span>'+
      (s.selStart ? '<button class="clear-btn" onclick="clearStatSel()">清空</button>' : '')+'</div>';
    html += '<div style="font-size:11px;color:var(--text-faint);margin-bottom:12px;padding:0 4px">点击某天选中当天，按住拖动选中一段区间</div>';
  } else {
    html += '<div class="cal-wrap double">';
    html += renderCalendar('stat', 'left', s.left.year, s.left.month);
    html += renderCalendar('stat', 'right', s.right.year, s.right.month);
    html += '</div>';
    html += '<div class="range-info"><span>'+fmtRangeInfo(s)+'</span>'+
      (s.selStart ? '<button class="clear-btn" onclick="clearStatSel()">清空</button>' : '')+'</div>';
    html += '<div style="font-size:11px;color:var(--text-faint);margin-bottom:12px;padding:0 4px">左右两个日历可以独立切换年月</div>';
  }
  var bounds = getStatBounds();
  var rs = filterRecordsInBounds(bounds[0], bounds[1]);
  var amountStats = buildAmountStats(rs);
  var contentStats = buildContentStats(rs);
  if (!rs.length) {
    html+='<div class="card"><p class="empty">这段时间还没有记录</p></div>';
    return html;
  }
  /* 1. 数值账 */
  if (amountStats.length) {
    amountStats.forEach(function(st){
      html+='<div class="card"><div class="card-title">'+
        '<div class="card-title-label">'+esc(st.unit)+'</div>'+
        '<div><span class="card-title-total">'+fmtNum(st.total)+'</span>'+
        '<span class="card-title-unit">'+esc(st.unit)+'</span></div></div>';
      st.items.forEach(function(it){
        var pct=st.total>0?(it.sum/st.total*100):0;
        html+='<div class="stat-row"><div class="stat-label"><span>'+(it.image?'<img src="'+it.image+'" style="width:16px;height:16px;object-fit:cover;border-radius:3px;vertical-align:-3px;margin-right:4px">':esc(it.icon)+' ')+esc(it.name)+' <span class="tag">'+it.count+'笔</span></span>'+
          '<span><b>'+fmtNum(it.sum)+'</b> '+esc(st.unit)+' <span style="color:var(--text-faint);margin-left:4px">'+Math.round(pct)+'%</span></span></div>'+
          '<div class="stat-bar"><div class="stat-bar-fill" style="width:'+pct+'%"></div></div></div>';
      });
      html+='</div>';
    });
  }
  /* 2. 内容账 */
  html += renderContentSection(rs);
  /* 3. 记录条数 */
  if (contentStats.length) {
    var totalCount = contentStats.reduce(function(a,c){ return a + c.count; }, 0);
    html+='<div class="card"><div class="card-title">'+
      '<div class="card-title-label">记录条数</div>'+
      '<div><span class="card-title-total">'+totalCount+'</span>'+
      '<span class="card-title-unit">条</span></div></div>';
    contentStats.forEach(function(it){
      var pct = totalCount>0 ? (it.count/totalCount*100) : 0;
      var detail = [];
      if (it.amountCount) detail.push(it.amountCount+' 条数值');
      if (it.contentCount) detail.push(it.contentCount+' 条内容');
      html+='<div class="stat-row"><div class="stat-label">'+
        '<span>'+(it.image?'<img src="'+it.image+'" style="width:16px;height:16px;object-fit:cover;border-radius:3px;vertical-align:-3px;margin-right:4px">':esc(it.icon)+' ')+esc(it.name)+' <span class="tag">'+detail.join(' · ')+'</span></span>'+
        '<span><b>'+it.count+'</b> 条</span></div>'+
        '<div class="stat-bar"><div class="stat-bar-fill alt" style="width:'+pct+'%"></div></div></div>';
    });
    html+='</div>';
  }
  return html;
}

function renderContentSection(rs){
  var tplIds = [];
  var seen = {};
  rs.forEach(function(r){
    if (r.content && String(r.content).trim() && !seen[r.templateId]) {
      seen[r.templateId] = true;
      tplIds.push(r.templateId);
    }
  });
  if (!tplIds.length) return '';
  if (!statState.contentTemplateId || tplIds.indexOf(statState.contentTemplateId) < 0) {
    statState.contentTemplateId = tplIds[0];
  }
  var html = '<div class="card">';
  html += '<div class="card-title"><div class="card-title-label">内容</div></div>';
  html += '<div class="content-tabs">';
  tplIds.forEach(function(tid){
    var t = state.data.templates.filter(function(x){return x.id===tid;})[0];
    if (!t) return;
    var active = tid === statState.contentTemplateId;
    var iconHtml = t.image ? '<img src="'+t.image+'" style="width:14px;height:14px;object-fit:cover;border-radius:3px;vertical-align:-2px;margin-right:4px">' : esc(t.icon)+' ';
    html += '<button class="content-tab'+(active?' active':'')+'" onclick="setContentTemplate(\''+tid+'\')">'+iconHtml+esc(t.name)+'</button>';
  });
  html += '</div>';
  html += '<div class="content-view-toggle">'+
    '<button class="'+(statState.contentView==='cloud'?'active':'')+'" onclick="setContentView(\'cloud\')">词语云</button>'+
    '<button class="'+(statState.contentView==='list'?'active':'')+'" onclick="setContentView(\'list\')">时间列表</button>'+
    '</div>';
  if (statState.contentView === 'cloud') {
    var cloud = buildContentCloud(rs, statState.contentTemplateId);
    if (!cloud.length) {
      html += '<p class="empty">这个模板还没有内容记录</p>';
    } else {
      var maxCount = cloud[0].count;
      html += '<div class="cloud">';
      cloud.forEach(function(item){
        var ratio = item.count / maxCount;
        var size = 14 + 14 * ratio;
        var weight = ratio > 0.6 ? '600' : '500';
        var opacity = 0.55 + 0.45 * ratio;
        html += '<span class="cloud-word" style="font-size:'+size+'px;font-weight:'+weight+';opacity:'+opacity+'">'+esc(item.word)+'<sup>'+item.count+'</sup></span>';
      });
      html += '</div>';
    }
  } else {
    var list = buildContentList(rs, statState.contentTemplateId);
    if (!list.length) {
      html += '<p class="empty">这个模板还没有内容记录</p>';
    } else {
      list.forEach(function(r){
        var d = new Date(r.at);
        var dateStr = (d.getMonth()+1)+'月'+d.getDate()+'日';
        html += '<div class="content-list-item">'+
          '<span class="content-list-date">'+dateStr+'</span>'+
          '<span class="content-list-text">'+esc(r.content)+'</span>'+
          '</div>';
      });
    }
  }
  html += '</div>';
  return html;
}

  if(state.currentAccountId) saveData();
  loadData(acc.id);
  closeModal(); state.view='home'; render();
}
function doRenameAccount(){
  var name=document.getElementById('renAccName').value.trim();
  if(!name) return alert('请输入名称');
  renameAccount(state.modal.id, name);
  closeModal(); render();
}
function doChangePin(){
  var oldP=document.getElementById('oldPin').value;
  var n1=document.getElementById('newPin1').value;
  var n2=document.getElementById('newPin2').value;
  if(!checkPin(oldP)) return alert('当前 PIN 不正确');
  if(n1.length<4) return alert('新 PIN 至少 4 位');
  if(n1!==n2) return alert('两次输入不一致');
  setPin(n1);
  closeModal();
  alert('PIN 已修改');
}

document.addEventListener('blur', function(e){
  if (!e.target || e.target.id !== 'recAt') return;
  var m = state.modal;
  if (!m || m.type !== 'record') return;
  var prec = m.template.precision || 'minute';
  if (prec === 'none') return;
  var text = e.target.value.trim();
  var iso = parseTimeText(text, prec);
  if (iso) e.target.value = fmtTimeByPrec(iso, prec);
}, true);

/* ============ 启动 ============ */
(function init(){
  loadAccounts();
  if(!hasPin()) state.view='setup';
  else state.view='lock';
  render();
})();
</script>
</body>
</html>
