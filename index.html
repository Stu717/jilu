<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeLog · 一句话记一件事</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .inp{width:100%;border:1px solid #e2e8f0;border-radius:.6rem;padding:.45rem .65rem;font-size:.875rem;outline:none;background:#fff;color:#0f172a}
  .inp:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.15)}
  .btn{border-radius:.6rem;padding:.45rem .9rem;font-size:.875rem;font-weight:500;transition:.15s;white-space:nowrap;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:#0f172a;color:#fff}.btn-primary:hover:not(:disabled){background:#1e293b}
  .btn-ghost{background:#f1f5f9;color:#334155}.btn-ghost:hover{background:#e2e8f0}
  .btn-danger{background:#fee2e2;color:#b91c1c}.btn-danger:hover{background:#fecaca}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #cbd5e1;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .evt{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:.8rem;text-align:left;transition:.15s;cursor:pointer;width:100%}
  .evt:hover{border-color:#94a3b8;box-shadow:0 2px 10px rgba(15,23,42,.06)}
  .pill{padding:.25rem .7rem;border-radius:999px;font-size:.75rem;background:#f1f5f9;color:#64748b;transition:.15s;cursor:pointer;border:none}
  .pill.on{background:#0f172a;color:#fff}
  .draft{border:1px solid #e2e8f0;border-radius:.75rem;padding:.75rem;background:#fff}
  .draft-new{border-color:#f59e0b;background:#fffbeb}
  .hidden{display:none!important}
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<!-- ========== 登录页 ========== -->
<div id="authView" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-3xl font-semibold tracking-tight">LifeLog</div>
      <div class="text-sm text-slate-500 mt-1">一句话，记一件事</div>
    </div>
    <div class="card p-6 space-y-3">
      <input id="authUser" class="inp" placeholder="用户名" autocomplete="username">
      <input id="authPass" class="inp" type="password" placeholder="密码" autocomplete="current-password">
      <div id="authMsg" class="text-xs text-rose-600 min-h-[16px]"></div>
      <button id="loginBtn" class="btn btn-primary w-full" type="button">登录</button>
      <button id="registerBtn" class="btn btn-ghost w-full" type="button">注册新账户</button>
      <p class="text-[11px] text-slate-400 leading-relaxed pt-1">
        账户与数据只保存在你自己的浏览器里。清除浏览器数据会丢失记录，建议定期在「设置」中导出备份。
      </p >
    </div>
  </div>
</div>

<!-- ========== 应用页 ========== -->
<div id="appView" class="hidden min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <button class="font-semibold tracking-tight" data-act="home" type="button">LifeLog</button>
      <div class="flex items-center gap-3 text-sm">
        <span id="userLabel" class="text-slate-400"></span>
        <button class="text-slate-500 hover:text-slate-900" data-act="settings" type="button">设置</button>
        <button class="text-slate-500 hover:text-slate-900" data-act="logout" type="button">退出</button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-5 pb-24 space-y-4">
    <section id="composer" class="card p-4">
      <textarea id="quickInput" rows="2" class="inp resize-none"
        placeholder="一句话：今天午饭牛肉面25，晚上跑步5公里，睡了7个半小时"></textarea>
      <div class="flex items-center justify-between mt-3 gap-2 flex-wrap">
        <span class="text-[11px] text-slate-400">⌘/Ctrl + Enter 解析</span>
        <div class="flex gap-2 shrink-0">
          <button class="btn btn-ghost" data-act="clear-quick" type="button">清空</button>
          <button id="parseBtn" class="btn btn-primary" data-act="parse" type="button">AI 解析</button>
        </div>
      </div>
      <div id="draftArea" class="mt-4"></div>
    </section>
    <div id="view"></div>
  </main>
</div>
