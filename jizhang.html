<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeLog · 一句话记录生活</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .inp { width:100%; border:1px solid #e2e8f0; border-radius:0.6rem; padding:0.45rem 0.65rem; font-size:0.875rem; outline:none; background:#fff; color:#0f172a; }
  .inp:focus { border-color:#94a3b8; box-shadow:0 0 0 3px rgba(148,163,184,.15); }
  .btn { border-radius:0.6rem; padding:0.45rem 0.9rem; font-size:0.875rem; font-weight:500; transition:.15s; }
  .btn-primary { background:#0f172a; color:#fff; }
  .btn-primary:hover { background:#1e293b; }
  .btn-ghost { background:#f1f5f9; color:#334155; }
  .btn-ghost:hover { background:#e2e8f0; }
  .btn-danger { background:#fee2e2; color:#b91c1c; }
  .btn-danger:hover { background:#fecaca; }
  .tab { padding:0.4rem 0.9rem; border-radius:0.6rem; font-size:0.875rem; color:#64748b; }
  .tab-active { background:#0f172a; color:#fff; }
  .tab:not(.tab-active):hover { background:#e2e8f0; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid #cbd5e1; border-top-color:#0f172a; border-radius:50%; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<!-- ============ 登录 / 注册 ============ -->
<div id="authView" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="text-3xl font-semibold tracking-tight">LifeLog</div>
      <div class="text-sm text-slate-500 mt-1">一句话，记录你的生活</div>
    </div>
    <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-3">
      <input id="authUser" class="inp" placeholder="用户名" autocomplete="username">
      <input id="authPass" class="inp" type="password" placeholder="密码" autocomplete="current-password">
      <div id="authMsg" class="text-xs text-rose-600 min-h-[16px]"></div>
      <button id="loginBtn" class="btn btn-primary w-full">登录</button>
      <button id="registerBtn" class="btn btn-ghost w-full">注册新账户</button>
      <p class="text-[11px] text-slate-400 leading-relaxed pt-1">
        账户与数据仅保存在你自己的浏览器中。清除浏览器数据会丢失记录，建议定期在「设置」里导出备份。
      </p >
    </div>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="appView" class="hidden min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="font-semibold tracking-tight">LifeLog</div>
      <div class="flex items-center gap-3 text-sm">
        <span id="userLabel" class="text-slate-400"></span>
        <button class="text-slate-500 hover:text-slate-900" data-act="logout">退出</button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-5 space-y-5 pb-24">

    <!-- 快速输入 -->
    <section class="bg-white rounded-2xl border border-slate-200 p-4">
      <textarea id="quickInput" rows="2" class="inp resize-none"
        placeholder="试着说：今天午饭牛肉面25，晚上跑步5公里，睡了7个半小时，买了两本书放书架第二层"></textarea>
      <div class="flex items-center justify-between mt-3 gap-2">
        <span class="text-[11px] text-slate-400">按 ⌘/Ctrl + Enter 快速解析</span>
        <div class="flex gap-2 shrink-0">
          <button class="btn btn-ghost" data-act="manual">手动添加</button>
          <button id="parseBtn" class="btn btn-primary" data-act="parse">解析</button>
        </div>
      </div>
      <div id="draftArea" class="mt-4"></div>
    </section>

    <!-- 标签页 -->
    <nav class="flex gap-1">
      <button class="tab tab-active" data-tab="records">记录</button>
      <button class="tab" data-tab="items">物品</button>
      <button class="tab" data-tab="stats">统计</button>
      <button class="tab" data-tab="settings">设置</button>
    </nav>

    <section id="tabContent"></section>
  </main>
</div>

};
